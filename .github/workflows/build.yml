name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Clean tessdata (keep only eng)
        shell: pwsh
        run: |
          $tess = "publish\tessdata"
          if (Test-Path $tess) {
            Get-ChildItem $tess -Recurse | Where-Object { $_.Name -ne "eng.traineddata" } | Remove-Item -Recurse -Force
          }

      - name: Remove extra language folders in publish
        shell: pwsh
        run: |
          $langs = @("cs","de","es","fr","it","ja","ko","pl","pt-BR","ru","tr","zh-Hans","zh-Hant")
          foreach ($l in $langs) {
            $p = "publish\$l"
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotemExcel-Windows-x64
          path: publish
