name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Clean publish folder
        shell: pwsh
        run: |
          # Удаляем все лишние языковые папки, которые Tesseract тянет при сборке
          $langs = @("cs","de","es","fr","it","ja","ko","pl","pt-BR","ru","tr","zh-Hans","zh-Hant")
          foreach ($l in $langs) {
            $p = "publish\$l"
            if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }

          # Полностью пересоздаём tessdata только с одним файлом
          $tess = "publish\tessdata"
          if (Test-Path $tess) { Remove-Item $tess -Recurse -Force }
          New-Item -ItemType Directory -Path $tess | Out-Null

          # Скачиваем eng.traineddata из tessdata_best (точнее, чем fast)
          $url = "https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile "$tess\eng.traineddata"

          # Проверяем, что файл на месте
          Write-Host "Contents of publish\tessdata:"
          Get-ChildItem $tess | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotemExcel-Windows-x64
          path: publish
