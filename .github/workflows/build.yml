
name: Build RotemExcel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore RotemExcel.csproj

      - name: Publish application
        run: >-
          dotnet publish RotemExcel.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish

      - name: Download OCR language data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/tessdata
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" `
            -OutFile "publish/tessdata/eng.traineddata"

      - name: Upload application folder
        uses: actions/upload-artifact@v4
        with:
          name: RotemExcel-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
