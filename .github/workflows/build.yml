
name: Build RotemExcel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows EXE
        run: >-
          dotnet publish RotemExcel.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RotemExcel-Windows-x64
          path: publish/RotemExcel.exe
          if-no-files-found: error
          retention-days: 14
